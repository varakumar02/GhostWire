// Standalone Gradle build of GhostWire for CI release APKs.
// The ROM builds this app with Soong (Android.bp); Soong ignores these files.
// Sources, res and the osmdroid AAR are the same ones the Soong build uses.
plugins {
    id 'com.android.application' version '8.11.1'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
}

// AGP rejects package= in the source manifest; strip it into a build copy.
def strippedManifest = file("${layout.buildDirectory.get().asFile}/gw/AndroidManifest.xml")
strippedManifest.parentFile.mkdirs()
strippedManifest.text = file("AndroidManifest.xml").text
    .replaceFirst(/\s+package="org\.ghostwire"/, '')

def ciVersionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'org.ghostwire'
    compileSdk 36
    defaultConfig {
        applicationId 'org.ghostwire'
        minSdk 35
        targetSdk 36
        versionCode ciVersionCode
        versionName "0.1-ci"
    }
    sourceSets.main {
        manifest.srcFile strippedManifest
        java.srcDirs = ["src"]
        kotlin.srcDirs = ["src"]
        res.srcDirs = ["res"]
        assets.srcDirs = ["assets"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation files("libs/osmdroid-android-6.1.20.aar")
}
